<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 348" width="680" role="img">
  <title>信号链路对比：看起来像转发链，实际是一条指令拆成两个独立动作</title>
  <desc>上半部分展示常见的错误理解（信号被改写后转发给系统，系统自动弹出亮度条），下半部分展示实际发生的情况（脚本截断信号后，分别调用 WMI 改亮度和 Shell 弹出亮度条，两者互不相干）。</desc>
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="348" fill="#FFFFFF"/>

  <g font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif">

    <text x="40" y="28" font-size="13" font-weight="500" fill="#5F5E5A">看起来像的：一条转发链</text>

    <rect x="40" y="44" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="115" y="64" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#444441">按 FN+F5</text>
    <text x="115" y="82" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">键盘发出信号</text>

    <path d="M190 72 H242" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrowGray)"/>

    <rect x="250" y="44" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="340" y="64" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#444441">把信号改成亮度键</text>
    <text x="340" y="82" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">改完再发给系统</text>

    <path d="M430 72 H472" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrowGray)"/>

    <rect x="480" y="44" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="560" y="64" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#444441">系统自动弹出</text>
    <text x="560" y="82" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">它知道亮度变了</text>

    <line x1="40" y1="124" x2="640" y2="124" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 4"/>

    <text x="40" y="152" font-size="13" font-weight="500" fill="#0C447C">实际发生的：一条指令，拆成两个互不相干的动作</text>

    <rect x="40" y="170" width="150" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="115" y="190" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">按 FN+F5</text>
    <text x="115" y="208" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#185FA5">Windows 收到「停止」</text>

    <path d="M190 198 H222" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

    <rect x="230" y="170" width="180" height="56" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
    <text x="320" y="190" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">脚本把信号截断</text>
    <text x="320" y="208" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#185FA5">不往下传，到此为止</text>

    <path d="M410 198 H435" fill="none" stroke="#185FA5" stroke-width="1.5"/>
    <path d="M435 198 V266" fill="none" stroke="#185FA5" stroke-width="1.5"/>
    <path d="M435 198 H452" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
    <path d="M435 266 H452" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

    <rect x="460" y="170" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="550" y="190" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">动作 A：改亮度</text>
    <text x="550" y="208" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#185FA5">WMI 直接写面板背光</text>

    <rect x="460" y="238" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="550" y="258" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">动作 B：弹那条 UI</text>
    <text x="550" y="276" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#185FA5">Shell 只管画出来</text>

    <text x="40" y="320" font-size="11.5" fill="#5F5E5A">A 和 B 之间没有因果关系：系统不会因为亮度被改了，就自己弹条。所以每次都得脚本手动叫一声。</text>
  </g>
</svg>
