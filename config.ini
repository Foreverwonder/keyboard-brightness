; ============================================================
;  键盘亮度调节 —— 设置文件
;
;  改完保存，然后关掉程序重新打开（或者右键托盘图标选
;  Reload This Script）就生效。不用改任何代码。
; ============================================================


[按键]
; 哪个键负责变暗、哪个键负责变亮。
;
; 常用的写法：
;   MediaStop        键盘上的「停止」键
;   MediaPrev        键盘上的「上一曲」键
;   MediaNext        「下一曲」
;   MediaPlayPause   「播放/暂停」
;   F5 / F6 / F7     功能键，直接写名字
;   A / B / 1 / 2    字母数字
;   ^!F5             Ctrl+Alt+F5（^=Ctrl  !=Alt  +=Shift）
;
; 不知道该填什么？把这行改成问号：
;   变暗=?
; 保存后重新打开程序，它会响两声提示你按键，
; 你按哪个键，它就自动记住哪个键，并写回这个文件。
变暗=MediaStop
变亮=MediaPrev


[亮度]
; 每按一下亮度变化多少。范围 1-50，数字越小越细腻。
; 音量键一下是 2 点，亮度建议 5 点左右比较跟手。
步长=5


[设备]
; 这一项控制「什么情况下才响应」。
;
; 留空 = 任何键盘、任何时候都响应。
; 填硬件 ID = 只有这颗键盘插着的时候才响应，
;             拔掉自动停用，插回自动恢复。
;
; 想让笔记本自带键盘不触发，就把外接键盘的 ID 填在这里，
; 比如 VID_1A2C&PID_40E2。查 ID 的命令在 README 里。
键盘ID=


[其他]
; 是 / 否：开机自动运行
开机自启=是

; 是 / 否：把每次按键记到 bright.log，排查问题用
记日志=是
